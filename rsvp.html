<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MeetApp Event</title>

<meta property="og:title" content="You're invited!">
<meta property="og:description" content="Tap to RSVP">
<meta property="og:type" content="website">

<style>

:root{
--bg:#f4f5f7;
--card:#ffffff;
--text:#1f2430;
--muted:#6b7280;
--line:#e6e8eb;
--brand:#2563eb;
--going:#16a34a;
--maybe:#d97706;
--no:#dc2626;
--radius:14px;
}

*{box-sizing:border-box;}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
background:var(--bg);
color:var(--text);
margin:0;
padding:0;
-webkit-font-smoothing:antialiased;
}

.container{
max-width:440px;
margin:auto;
padding:24px 20px 40px;
}

.card{
background:var(--card);
padding:28px 24px;
border-radius:var(--radius);
box-shadow:0 10px 30px rgba(17,24,39,0.08);
text-align:center;
}

h2{
margin:0 0 4px;
font-size:22px;
line-height:1.3;
font-weight:700;
}

.info{
color:var(--muted);
margin-bottom:16px;
font-size:14px;
line-height:1.5;
}

.info p{margin:4px 0;}

.host{
display:flex;
align-items:center;
gap:12px;
margin:16px 0;
padding:12px 14px;
border:1px solid var(--line);
border-radius:12px;
text-align:left;
background:#fafbfc;
}

.host img{
width:48px;
height:48px;
border-radius:50%;
object-fit:cover;
background:#e9e9e9;
flex-shrink:0;
}

.hostName{
font-weight:600;
color:var(--text);
font-size:15px;
}

.hostLabel{
font-size:11px;
font-weight:700;
letter-spacing:0.6px;
color:var(--muted);
text-transform:uppercase;
margin-bottom:2px;
}

.hostPhone{
font-size:13px;
color:var(--muted);
}

.invitationImage{
width:100%;
margin:12px 0 16px;
border-radius:12px;
object-fit:cover;
display:none;
}

.attendees{
font-size:13px;
color:var(--muted);
margin:8px 0 4px;
}

.locationLink{
color:var(--brand);
text-decoration:none;
font-weight:500;
}

.locationLink:hover{text-decoration:underline;}

.field{
text-align:left;
margin-top:14px;
}

.field label{
display:block;
font-size:13px;
font-weight:600;
color:var(--text);
margin-bottom:6px;
}

input,select{
width:100%;
padding:12px 14px;
border-radius:10px;
border:1px solid var(--line);
font-size:16px;
color:var(--text);
background:#fff;
transition:border-color .15s ease, box-shadow .15s ease;
}

input::placeholder{color:#9ca3af;}

input:focus,select:focus,button:focus-visible{
outline:none;
border-color:var(--brand);
box-shadow:0 0 0 3px rgba(37,99,235,0.15);
}

input:disabled,select:disabled,button:disabled{
opacity:.6;
cursor:not-allowed;
}

input.invalid{
border-color:var(--no);
box-shadow:0 0 0 3px rgba(220,38,38,0.12);
}

.error{
display:none;
color:var(--no);
font-size:12px;
margin-top:6px;
text-align:left;
}

.error.show{display:block;}

.phoneRow{
display:flex;
gap:8px;
align-items:stretch;
}

.phoneRow select{
width:auto;
max-width:150px;
flex-shrink:0;
}

.phoneRow input{
flex:1;
}

.buttons{
margin-top:22px;
display:flex;
flex-direction:column;
gap:10px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:600;
cursor:pointer;
color:#fff;
transition:transform .06s ease, filter .15s ease, box-shadow .15s ease;
}

button:hover:not(:disabled){filter:brightness(1.05);}
button:active:not(:disabled){transform:translateY(1px);}

.going{background:var(--going);}
.maybe{background:var(--maybe);}
.no{background:var(--no);}

button.selected{
box-shadow:0 0 0 3px rgba(31,36,48,0.12), 0 4px 12px rgba(0,0,0,0.12);
filter:brightness(1.05);
}

button.selected::after{
content:" ✓";
}

.status{
margin-top:16px;
color:var(--text);
font-size:14px;
min-height:20px;
}

.status.success{color:var(--going);font-weight:600;}
.status.closed{color:var(--no);font-weight:600;}

.install{
margin-top:26px;
font-size:13px;
color:var(--muted);
line-height:1.6;
}

.install a{
color:var(--brand);
text-decoration:none;
font-weight:500;
}

.install a:hover{text-decoration:underline;}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2 id="title">Loading event...</h2>

<div class="info">
<p id="time"></p>
<p id="location"></p>
</div>

<div class="host" id="hostSection" style="display:none;">
<img id="hostDp" alt="Host profile">
<div>
<div class="hostLabel">Host</div>
<div class="hostName" id="hostName"></div>
<div class="hostPhone" id="hostPhone"></div>
</div>
</div>

<img id="invitationImage" class="invitationImage" alt="Event invitation">

<p id="attendees" class="attendees"></p>

<div class="field">
<label for="name">Your name</label>
<input id="name" placeholder="Enter your name">
<div class="error" id="nameError">Please enter your name</div>
</div>

<div class="field">
<label for="phone">Your phone number</label>
<div class="phoneRow">
<select id="countryCode" aria-label="Country code"></select>
<input id="phone" placeholder="Phone number" type="tel">
</div>
<div class="error" id="phoneError">Please enter your phone number</div>
</div>

<div class="buttons">

<button class="going" onclick="rsvp('Accepted', this)">Going</button>
<button class="maybe" onclick="rsvp('Maybe', this)">Maybe</button>
<button class="no" onclick="rsvp('Declined', this)">Not Going</button>

</div>

<p class="status" id="status"></p>

<div class="install">
Organize events easily with
<b>MeetApp</b><br>
<a href="https://apps.apple.com/app/id6759666840" target="_blank">Download on the App Store</a>
&nbsp;·&nbsp;
<a href="https://play.google.com/store/apps/details?id=com.jarawas.meetapp" target="_blank">Get it on Google Play</a>
</div>

</div>

</div>

function populateCountryCodes() {
  const select = document.getElementById("countryCode");
  if (!select) return;
  COUNTRY_CODES.forEach(([name, dial]) => {
    const option = document.createElement("option");
    option.value = dial;
    option.textContent = `${name} (${dial})`;
    if (name === "India") option.selected = true;
    select.appendChild(option);
  });
}

function setRsvpSubmitting(isSubmitting) {
  isSubmittingRsvp = isSubmitting;

  const buttons = document.querySelectorAll(".buttons button");
  buttons.forEach((button) => {
    const shouldDisable = isSubmitting || isRsvpClosed;
    button.disabled = shouldDisable;
    button.style.opacity = shouldDisable ? "0.6" : "1";
    button.style.cursor = shouldDisable ? "not-allowed" : "pointer";
  });

  const nameInput = document.getElementById("name");
  const phoneInput = document.getElementById("phone");
  const countrySelect = document.getElementById("countryCode");
  if (nameInput) nameInput.disabled = isSubmitting || isRsvpClosed;
  if (phoneInput) phoneInput.disabled = isSubmitting || isRsvpClosed;
  if (countrySelect) countrySelect.disabled = isSubmitting || isRsvpClosed;

  if (isSubmitting) {
    document.getElementById("status").innerText = "Submitting RSVP...";
  }
}

function closeRsvp(message) {
  isRsvpClosed = true;
  const statusEl = document.getElementById("status");
  statusEl.innerText = message;
  statusEl.classList.add("closed");
  statusEl.classList.remove("success");

  setRsvpSubmitting(false);
}

function escapeHtml(value) {
  const div = document.createElement("div");
  div.innerText = value == null ? "" : String(value);
  return div.innerHTML;
}

function setFieldError(inputId, errorId, show) {
  const input = document.getElementById(inputId);
  const error = document.getElementById(errorId);
  if (input) input.classList.toggle("invalid", show);
  if (error) error.classList.toggle("show", show);
}

// Extract encoded event ID from URL path
function getEncodedEventId() {
  const hashValue = window.location.hash.replace("#", "").trim();
  if (hashValue) {
    return hashValue;
  }

  const pathSegments = window.location.pathname.split("/").filter(Boolean);
  const lastSegment = pathSegments[pathSegments.length - 1] || "";
  if (!lastSegment || lastSegment.endsWith(".html")) {
    return "";
  }

  return lastSegment;
}

const encodedEventId = getEncodedEventId();

console.log("[RSVP] Encoded Event ID:", encodedEventId);
  
// Fetch event details from Lambda
async function loadEventDetails() {
  if (!encodedEventId) {
    document.getElementById("title").innerText = "Invalid event link";
    return;
  }
  
  try {
    console.log("[RSVP] GET URL:", `${API_BASE_URL}/meetapp/event/rsvp/${encodedEventId}`);
    const response = await fetch(`${API_BASE_URL}/meetapp/event/rsvp/${encodedEventId}`);
    const data = await response.json();

    if (data.success && data.data) {
      const event = data.data;

      // Set event title
      document.getElementById("title").innerText = event.title || "Event";

      // Format and display time
      const startTime = new Date(event.evStartTime);
      const endTime = new Date(event.evEndTime);
      const dateStr = startTime.toLocaleDateString('en-US', {
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
        const endDateStr = endTime.toLocaleDateString('en-US', {
          weekday: 'short',
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });
      const startTimeStr = startTime.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit'
      });
      const endTimeStr = endTime.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit'
      });

        const isSameDay = startTime.toDateString() === endTime.toDateString();
        document.getElementById("time").innerText = isSameDay
          ? `${dateStr}, ${startTimeStr} - ${endTimeStr}`
          : `${dateStr}, ${startTimeStr} - ${endDateStr}, ${endTimeStr}`;

      const now = Date.now();
      const startMs = Number(event.evStartTime);
      const endMs = Number(event.evEndTime);
      if (!Number.isNaN(startMs) && now >= startMs) {
        if (!Number.isNaN(endMs) && now >= endMs) {
          closeRsvp("This event has already occurred. RSVP is closed.");
        } else {
          closeRsvp("This event has already started. RSVP is closed.");
        }
      }

      // Display location if available
      if (event.location) {
        if (event.location.startsWith("http://") || event.location.startsWith("https://")) {
          document.getElementById("location").innerHTML = `<a class="locationLink" href="${event.location}" target="_blank" rel="noopener noreferrer">Open location</a>`;
        } else {
          const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(event.location)}`;
          document.getElementById("location").innerHTML = `<a class="locationLink" href="${mapsUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(event.location)}</a>`;
        }
      }

      // Display host details
      if (event.host) {
        document.getElementById("hostSection").style.display = "flex";
        document.getElementById("hostName").innerText = event.host.name || "Host";
        document.getElementById("hostPhone").innerText = event.host.phone || "";

        const hostDp = document.getElementById("hostDp");
        hostDp.onerror = function () {
          this.onerror = null;
          this.src = HOST_DP_FALLBACK;
        };

        if (event.host.dpUrl) {
          hostDp.src = event.host.dpUrl;
        } else {
          hostDp.src = HOST_DP_FALLBACK;
        }
      }

      // Display invitation image
      if (event.invitationUrl) {
        const invitationImage = document.getElementById("invitationImage");
        invitationImage.src = event.invitationUrl;
        invitationImage.style.display = "block";
      }

      // Display RSVP counts
      const counts = event.rsvpStatus;
      if (counts) {
        document.getElementById("attendees").innerText =
          `${counts.accepted || 0} going • ${counts.maybe || 0} maybe • ${counts.notResponded || 0} awaiting response`;
      }
    } else {
      document.getElementById("title").innerText = "Event not found";
    }
  } catch (error) {
    console.error("Error loading event details:", error);
    document.getElementById("title").innerText = "Error loading event";
  }
}

// Submit RSVP
async function rsvp(status, clickedButton) {
  const statusEl = document.getElementById("status");

  if (isRsvpClosed) {
    statusEl.innerText = "This event is no longer accepting RSVP responses.";
    return;
  }

  if (isSubmittingRsvp) {
    return;
  }

  const name = document.getElementById("name").value.trim();
  const rawPhone = document.getElementById("phone")?.value?.trim() || "";
  const dialCode = document.getElementById("countryCode")?.value || "";

  const missingName = !name;
  const missingPhone = !rawPhone;
  setFieldError("name", "nameError", missingName);
  setFieldError("phone", "phoneError", missingPhone);
  if (missingName || missingPhone) {
    (missingName ? document.getElementById("name") : document.getElementById("phone")).focus();
    return;
  }

  // Build an E.164 number. If the user already typed a country code ("+..."),
  // respect it; otherwise prepend the selected country's dial code.
  const phone = rawPhone.startsWith("+")
    ? "+" + rawPhone.slice(1).replace(/\D/g, "")
    : dialCode + rawPhone.replace(/\D/g, "");

  setRsvpSubmitting(true);

  try {
    const response = await fetch(`${API_BASE_URL}/meetapp/event/rsvp`, {
      method: "POST",
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        encoded_event_id: encodedEventId,
        name: name,
        phone: phone,
        status: status
      })
    });

    const data = await response.json();

    if (data.success) {
      document.querySelectorAll(".buttons button").forEach((b) => b.classList.remove("selected"));
      if (clickedButton) clickedButton.classList.add("selected");
      statusEl.classList.add("success");
      const label = clickedButton ? clickedButton.innerText.trim() : "";
      statusEl.innerText = label
        ? `You're marked as "${label}" 🎉`
        : "RSVP saved 🎉";
    } else {
      statusEl.classList.remove("success");
      statusEl.innerText = "Error: " + (data.message || "Failed to save RSVP");
    }
  } catch (error) {
    console.error("Error submitting RSVP:", error);
    statusEl.classList.remove("success");
    statusEl.innerText = "Error submitting RSVP. Please try again.";
  } finally {
    if (!isRsvpClosed) {
      setRsvpSubmitting(false);
    }
  }
}

// Load event details when page loads
populateCountryCodes();
loadEventDetails();

</script>

</html>
